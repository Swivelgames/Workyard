[workspace]
members = ["crates/core", "crates/git", "crates/state", "crates/application", "crates/cli", "crates/system"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Swivelgames/Workyard"
publish = false

[workspace.dependencies]
workyard-system = { path = "crates/system" }
workyard-core = { path = "crates/core" }
workyard-git = { path = "crates/git" }
workyard-state = { path = "crates/state" }
workyard-application = { path = "crates/application" }
trine = "=0.0.1"
smol = "2.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
atomicwrites = "0.4.4"
sha2 = "0.11.0"
tempfile = "3"
ctrlc = "3"
unicode-width = "0.2"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object", "creation-flags"] }
