[package]
name = "workyard"
description = "Manage Git worktrees across repositories from a single task workspace"
keywords = ["git", "git-worktree", "multi-repo", "workspace", "cli"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
readme = "../../README.md"

[dependencies]
clap_lex = "1"
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
workyard-application.workspace = true
trine.workspace = true
ctrlc.workspace = true

[dev-dependencies]
smol.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[[bin]]
name = "workyard"
path = "src/main.rs"

[dev-dependencies.process-wrap]
workspace = true

[dev-dependencies.workyard-core]
workspace = true

[dev-dependencies.workyard-git]
workspace = true

[dev-dependencies.workyard-state]
workspace = true
