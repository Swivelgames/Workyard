[package]
name = "workyard-git"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
workyard-system.workspace = true
workyard-core.workspace = true
smol.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true
