[package]
name = "workyard-git"
description = "Git worktree inspection and process supervision for Workyard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cap-primitives = "4.0.3"
workyard-system.workspace = true
workyard-core.workspace = true
smol.workspace = true
sha2.workspace = true
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winx = "0.36.4"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true
